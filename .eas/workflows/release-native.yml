# Builds native binaries and ships them to TestFlight and Play internal testing.
# Triggered by changes that JS-over-the-air can't deliver — new/updated
# dependencies, app config, or native plugins — so `git push` is the only
# action needed.
#
# iOS and Android build in parallel; each submits as soon as its own build is
# done, so a slow platform never holds up the other.
#
# No tag trigger: `paths` filters tag pushes too, so a tag would only fire when
# the tagged commit happened to touch these files. To force a build without a
# native change, run it directly:
#   npx eas-cli workflow:run .eas/workflows/release-native.yml
#
# Everything else (app/, components/, lib/, …) ships over the air via
# publish-ota.yml and never builds a binary.
name: Release native build

on:
  push:
    branches: ['main']
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.js
      - plugins/**
      - .easignore
      # The workflow and submit config are part of what this job does. Without
      # these, editing them silently doesn't re-run it — which is how the
      # Android jobs sat here unexecuted after they were added.
      - .eas/workflows/release-native.yml
      - eas.json

# Superseded runs are cancelled, so only the newest push is left building. On
# the free plan Android builds can sit queued for hours, and without this each
# push stacks another one behind it — they'd all eventually build and submit,
# oldest first, and the newest commit would land last.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 22.14.0

jobs:
  build_ios:
    name: eas build ios → production
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  # `type: submit` uploads and assigns groups but never submits for Beta App
  # Review, so builds pile up at READY_FOR_BETA_SUBMISSION and external testers
  # keep getting an old one — builds 14, 15 and 16 all stalled that way while
  # the public link still served 13. `type: testflight` does the review
  # submission too. Only the EXTERNAL group is listed; Apple distributes to
  # internal groups automatically and rejects explicit assignment.
  # type: submit, NOT type: testflight. A testflight job that submits an EAS
  # build (build_id) is a PAID-plan feature; on the free plan it fails instantly
  # with "Failed to start job" and never uploads. That failure is easy to miss
  # because build_ios still goes green — builds 17, 18 and 19 all completed and
  # none of them ever reached App Store Connect. The free-plan alternative the
  # error suggests, asc_build_id, is circular: it submits a build that is already
  # in App Store Connect, which is the very step that is failing.
  #
  # type: submit uploads the EAS build to App Store Connect, which is what
  # attaching a build to a version actually needs. Apple's Beta App Review is
  # required once per app for EXTERNAL TestFlight testers and is not needed for
  # an App Store release.
  submit_ios:
    name: submit → App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  build_android:
    name: eas build android → production
    type: build
    environment: production
    params:
      platform: android
      profile: production

  submit_android:
    name: submit → Play internal
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
