# Builds a native binary and submits it to TestFlight. Triggered by changes that
# JS-over-the-air can't deliver — new/updated dependencies, app config, or
# native plugins — so `git push` is the only action needed.
#
# No tag trigger: `paths` filters tag pushes too, so a tag would only fire when
# the tagged commit happened to touch these files. To force a build without a
# native change, run it directly:
#   npx eas-cli workflow:run .eas/workflows/release-native.yml
#
# Everything else (app/, components/, lib/, …) ships over the air via
# publish-ota.yml and never builds a binary.
name: Release native build

on:
  push:
    branches: ['main']
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.js
      - plugins/**
      - .easignore

defaults:
  tools:
    node: 22.14.0

jobs:
  build_ios:
    name: eas build ios → production
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: submit → TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
