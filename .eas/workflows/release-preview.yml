# The preview lane. Pushes to `develop` build against the `preview` profile,
# which bakes channel `preview` into the binary — so a TestFlight / Play
# internal build made here only ever receives OTA updates published to the
# `preview` branch, and production users on `main` never see any of it.
#
# This is how a restyle or a risky change gets looked at on a real phone
# before it lands: push to develop, install from TestFlight, then merge.
#
# Same shape as release-native.yml, and the same rules apply: `type: submit`
# not `type: testflight` (free plan), Android `releaseStatus` stays `draft`
# while the Play app is a draft app, and the workflow file plus eas.json are in
# `paths` so editing the pipeline re-runs it. Android goes to the `internal`
# track, which is separate from the `alpha` closed test that drives the 14-day
# production-access clock, so previewing never disturbs that.
name: Release preview build

on:
  push:
    branches: ['develop']
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.js
      - plugins/**
      - .easignore
      - .eas/workflows/release-preview.yml
      - eas.json

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 22.14.0

jobs:
  build_ios:
    name: eas build ios → preview
    type: build
    environment: production
    params:
      platform: ios
      profile: preview

  # Uploads to App Store Connect. The account holder is an INTERNAL TestFlight
  # tester, so the build is installable minutes after Apple processes it — no
  # Beta App Review, no group assignment needed.
  submit_ios:
    name: submit → TestFlight (preview)
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview

  build_android:
    name: eas build android → preview
    type: build
    environment: production
    params:
      platform: android
      profile: preview

  submit_android:
    name: submit → Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: preview
